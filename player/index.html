<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>commercial_free — Phase 1 PoC player</title>
<style>
  body { margin: 0; background: #0d0d12; color: #ccc;
         font: 13px/1.4 -apple-system, Helvetica, sans-serif; }
  #stage { position: relative; max-width: 1280px; margin: 24px auto; }
  video { display: block; width: 100%; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           pointer-events: none; }
  #hud { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px;
         background: rgba(0,0,0,.6); border-radius: 4px;
         font-family: ui-monospace, monospace; }
  #cfg { max-width: 1280px; margin: 0 auto; color: #777; }
  #cfg code { color: #aaa; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" controls playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="hud">loading…</div>
</div>
<div id="cfg"></div>
<script src="compositor.js"></script>
</body>
</html>
